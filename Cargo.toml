[package]
name = "shlteLLM"
version = "3.2.2"
edition = "2021"
authors = ["QD·shlte"]
description = "LLM训练工具"
license = "MIT"
readme = "README.md"
build = "build.rs"
resolver = "2"

# =====依赖=====
[dependencies]
# 命令行解析
clap = { version = "4.5", features = ["derive"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

# 数据库
rusqlite = { version = "0.33", features = ["bundled"] }

# 网络请求
reqwest = { version = "0.12", features = ["json", "stream"], default-features = false }

# 异步运行时
tokio = { version = "1.42", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }

# 随机数
rand = "0.9"
rand_distr = "0.5"

# 错误处理
thiserror = "2.0"

# 日志
log = "0.4"
env_logger = "0.11"

# 进度条
indicatif = "0.18"

# 数值类型
half = "2.4"

# 数据格式处理
parquet = { version = "58", optional = true }
arrow = { version = "58", optional = true }
csv = "1.3"

# 压缩
flate2 = "1.0"

# 并发
crossbeam = "0.8"
rayon = "1.10"

# 异步流
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }

# 时间处理
chrono = "0.4"

# 哈希
md5 = "0.8"

# Protobuf
prost = "0.13"

# CRC校验
crc32fast = "1.4"

# 系统信息
num_cpus = "1.16"

# 临时文件
tempfile = "3.14"

# 文件遍历
walkdir = "2.5"

# Base64编码
base64 = "0.22"

# TUI 界面
crossterm = "0.28"
ratatui = "0.28"

# MessagePack 序列化
rmp-serde = "1.3"

# 系统信息（性能监控）
sysinfo = "0.33"

# =====编译设置=====
[features]
default = ["dep:parquet", "dep:arrow"]
onnx = []
llama-cpp = ["dep:bindgen"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
strip = true

[profile.dev]
opt-level = 0
debug = true

[[bin]]
name = "shlteLLM"
path = "src/main.rs"

[build-dependencies]
bindgen = { version = "0.72", optional = true }
